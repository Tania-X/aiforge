# AI PR Review — 自建 CodeRabbit 替代
#
# 触发: PR 打开/更新/重新打开(目标 main)时, 用 LLM 审查 diff 并发表整体 review 评论。
# 依赖: Secret DEEPSEEK_API_KEY + ai-tools 的 pr-review action(@main)
# 门禁: 存在 error 级别问题时 "AI Review" check-run 失败(PR 变红)。
# 审查行为配置: 仓库根 .ai-review.yaml(如有)
name: AI Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AI PR Review
        uses: Tania-X/ai-tools/pr-review@main
        with:
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          model: deepseek-chat
          config-path: .ai-review.yaml
          # 成本核算: 未填单价时自动按 DeepSeek 官方峰谷价表计算(ai-tools@main 内置)
          # OTel 可观测性: 上报审查链路 trace 到自建 jaeger(4318, admin 认证)
          otel-enabled: "1"
          otel-endpoint: "http://47.98.234.129:4318"
          otel-service-name: "ai-tools-review"
          otel-headers: ${{ secrets.JAEGER_OTLP_AUTH }}
